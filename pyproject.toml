[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-scraper"
version = "1.1.3"
description = "MCP 网页抓取服务"
authors = [{name = "Ben"}]
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["patches", "patches/*", "src/*", "scraper", "scraper/*"]
